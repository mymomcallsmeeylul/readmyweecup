<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Destiny — read my wee cup</title>
    <meta
      name="description"
      content="Get your cup reading, unfold your fortune. Photograph the inside of your drained Turkish coffee cup and read what settled."
    />
    <meta name="theme-color" content="#ECE6DB" />
    <meta name="color-scheme" content="light" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Destiny — read my wee cup" />
    <meta property="og:description" content="Get your cup reading, unfold your fortune." />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600&family=Familjen+Grotesk:wght@400;500;600&family=Fragment+Mono:ital@0;1&family=IM+Fell+English:ital@0;1&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="/styles/tokens.css" />
    <link rel="stylesheet" href="/styles/app.css" />
  </head>

  <body>
    <!-- The ASCII field: the dictionary's own symbols, drifting brown behind
         everything. Decorative, so it is hidden from assistive tech, and it
         takes no pointer events: nothing the seeker does reaches it. -->
    <div class="ascii" id="asciiField" aria-hidden="true"></div>
    <div class="grain" aria-hidden="true"></div>

    <main class="app" id="app">
      <!-- =============================================================== MAIN -->
      <section class="screen screen--fixed" id="s-main" aria-labelledby="main-title">
        <header class="bar bar--end">
          <!-- Language first, settings last: the settings icon keeps the
               corner it has always had and the new control sits inboard. -->
          <div class="lang" id="langPicker" role="radiogroup" data-t-aria="a11y.language">
            <button class="lang__opt" type="button" role="radio" data-lang="en" aria-checked="true">
              EN
            </button>
            <button class="lang__opt" type="button" role="radio" data-lang="tr" aria-checked="false">
              TR
            </button>
          </div>

          <button
            class="icon-btn"
            id="btnSettings"
            type="button"
            data-icon="settings"
            data-t-aria="a11y.settings"
          ></button>
        </header>

        <div class="screen__body main">
          <h1 class="display display--center" id="main-title">Destiny</h1>

          <p class="lede lede--center" id="mainLede" data-t="main.lede"></p>

          <!-- Empty: one tile to open the gallery. -->
          <div class="add" id="addBlock">
            <button
              class="tile tile--add"
              id="btnAddPhotos"
              type="button"
              data-icon="plus"
              data-icon-size="32"
              aria-labelledby="addLabel"
            ></button>
            <span class="tile__label" id="addLabel" data-t="main.addPhotos"></span>
          </div>

          <!-- Filled: up to four photographs of the one cup. -->
          <ul class="photos" id="photoGrid" hidden data-t-aria="a11y.yourCup"></ul>
          <p class="photos__hint meta" id="photoHint" hidden></p>
        </div>

        <div class="compose" id="compose" hidden>
          <div
            class="tags"
            id="tags"
            role="radiogroup"
            data-t-aria="a11y.tags"
          >
            <button class="chip" type="button" role="radio" data-topic="love" aria-checked="false" data-t="topic.love"></button>
            <button class="chip" type="button" role="radio" data-topic="career" aria-checked="false" data-t="topic.career"></button>
            <button class="chip" type="button" role="radio" data-topic="general" aria-checked="true" data-t="topic.general"></button>
            <button class="chip" type="button" role="radio" data-topic="friendships" aria-checked="false" data-t="topic.friendships"></button>
            <button class="chip" type="button" role="radio" data-topic="health" aria-checked="false" data-t="topic.health"></button>
            <button class="chip" type="button" role="radio" data-topic="money" aria-checked="false" data-t="topic.money"></button>
          </div>

          <div class="prompt">
            <label class="u-sr" for="promptInput" data-t="a11y.promptLabel"></label>
            <input
              class="prompt__field"
              id="promptInput"
              type="text"
              maxlength="400"
              autocomplete="off"
              data-t-placeholder="main.placeholder"
            />
            <button class="btn btn--primary prompt__send" id="btnSend" type="button" data-t="main.send"></button>
          </div>
        </div>

        <input
          class="file-input"
          id="filePicker"
          type="file"
          accept="image/*"
          multiple
          tabindex="-1"
          data-t-aria="a11y.picker"
        />
      </section>

      <!-- ==================================================== READING MOMENT -->
      <section class="screen screen--fixed" id="s-reading" hidden aria-labelledby="reading-title">
        <header class="bar">
          <span class="meta" data-t="wait.label"></span>
        </header>

        <h2 class="u-sr" id="reading-title" data-t="wait.title"></h2>

        <div class="wait">
          <!-- Where the beaded cup used to be. A symbol surfaces, holds, and
               gives way to the next while the cup is being read. Filled by
               scripts/ascii.js; decorative, and driven by a timer rather than
               by anything the seeker does. -->
          <pre class="wait__ascii" id="waitAscii" aria-hidden="true"></pre>

          <p class="wait__line" id="readingLine" role="status" aria-live="polite"></p>

          <div class="wait__track" aria-hidden="true">
            <div class="wait__fill" id="waitFill"></div>
          </div>
        </div>
      </section>

      <!-- =============================================================== REVEAL -->
      <section class="screen" id="s-reveal" hidden aria-labelledby="omen">
        <header class="bar">
          <span class="meta" id="revealMeta"></span>
        </header>

        <article class="reveal">
          <h2 class="reveal__omen stage" id="omen" style="--i: 0"></h2>

          <hr class="divider stage" style="--i: 1" />

          <!-- The ink blot that used to sit behind the fortune is gone with
               the rest of the coffee drawings. The ASCII field behind the page
               is the texture now, and one texture is enough. -->
          <div class="stanzas" id="stanzas"></div>

          <div class="closing stage" id="closingBlock">
            <p class="closing__line" id="closing"></p>
          </div>

          <p class="meta stage" id="demoNote" hidden data-t="reveal.demo"></p>

          <div class="reveal__actions stage" id="revealActions">
            <button class="btn btn--primary" id="btnShare" type="button" data-t="reveal.share"></button>
            <button class="btn btn--secondary" type="button" data-go="main" data-t="reveal.another"></button>
          </div>
        </article>
      </section>

      <!-- ========================================================== UNREADABLE -->
      <section class="screen screen--fixed" id="s-empty" hidden aria-labelledby="emptyOmen">
        <header class="bar">
          <button class="back" type="button" data-go="main" data-t="empty.back"></button>
          <span class="meta" id="emptyLabel" data-t="empty.label"></span>
        </header>

        <div class="screen__body">
          <div class="empty">
            <h2 class="display" id="emptyOmen"></h2>
            <p class="empty__note" id="emptyNote"></p>
            <p class="empty__hint" id="emptyHint"></p>
          </div>
        </div>

        <div class="screen__foot">
          <button class="btn btn--primary" id="emptyRetry" type="button" data-go="main" data-t="empty.retry"></button>
        </div>
      </section>
    </main>

    <!-- ============================================================ SHARE SHEET -->
    <div
      class="sheet"
      id="shareSheet"
      hidden
      role="dialog"
      aria-modal="true"
      aria-labelledby="sheetTitle"
    >
      <div class="sheet__scrim" data-close-sheet></div>

      <div class="sheet__panel">
        <div class="sheet__head">
          <span class="meta" id="sheetTitle" data-t="share.title"></span>
          <button class="back" type="button" data-close-sheet data-t="share.close"></button>
        </div>

        <div class="sheet__card">
          <img id="shareCard" data-t-alt="a11y.cardAlt" />
        </div>

        <div class="sheet__actions">
          <button class="btn btn--primary" id="btnShareImage" type="button" data-t="share.share"></button>
          <button class="btn btn--secondary" id="btnSaveImage" type="button" data-t="share.save"></button>
          <button class="link" id="btnCopyText" type="button" data-t="share.copy"></button>
        </div>

        <p class="sheet__status" id="sheetStatus" role="status" aria-live="polite"></p>
      </div>
    </div>

    <!-- ========================================================= SETTINGS SHEET -->
    <div
      class="sheet"
      id="settingsSheet"
      hidden
      role="dialog"
      aria-modal="true"
      aria-labelledby="settingsTitle"
    >
      <div class="sheet__scrim" data-close-sheet></div>

      <div class="sheet__panel">
        <div class="sheet__head">
          <span class="meta" id="settingsTitle" data-t="settings.title"></span>
          <button class="back" type="button" data-close-sheet data-t="share.close"></button>
        </div>

        <div class="setting">
          <div class="setting__text">
            <p class="setting__label" data-t="settings.sound"></p>
            <p class="setting__note" data-t="settings.soundNote"></p>
          </div>
          <button class="chip" id="soundToggle" type="button" aria-pressed="false">
            <span id="soundLabel" data-t="settings.off"></span>
          </button>
        </div>
      </div>
    </div>

    <script type="module" src="/scripts/app.js"></script>
  </body>
</html>
