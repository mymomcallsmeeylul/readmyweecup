<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Destiny — read my wee cup</title>
    <meta
      name="description"
      content="Get your cup reading, unfold your fortune. Photograph the inside of your drained Turkish coffee cup and read what settled."
    />
    <meta name="theme-color" content="#ECE6DB" />
    <meta name="color-scheme" content="light" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Destiny — read my wee cup" />
    <meta property="og:description" content="Get your cup reading, unfold your fortune." />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600&family=Fragment+Mono:ital@0;1&family=IM+Fell+English:ital@0;1&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="/styles/tokens.css" />
    <link rel="stylesheet" href="/styles/app.css" />
  </head>

  <body>
    <div class="grain" aria-hidden="true"></div>

    <main class="app" id="app">
      <!-- =============================================================== MAIN -->
      <section class="screen screen--fixed" id="s-main" aria-labelledby="main-title">
        <header class="bar bar--end">
          <button
            class="icon-btn"
            id="btnSettings"
            type="button"
            data-icon="settings"
            aria-label="Settings"
          ></button>
        </header>

        <div class="screen__body main">
          <h1 class="display display--center" id="main-title">Destiny</h1>

          <p class="lede lede--center" id="mainLede">
            Get your cup reading, unfold your fortune.
          </p>

          <!-- Empty: one tile to open the gallery. -->
          <div class="add" id="addBlock">
            <button
              class="tile tile--add"
              id="btnAddPhotos"
              type="button"
              data-icon="plus"
              data-icon-size="32"
              aria-labelledby="addLabel"
            ></button>
            <span class="tile__label" id="addLabel">Add photos</span>
          </div>

          <!-- Filled: up to four photographs of the one cup. -->
          <ul class="photos" id="photoGrid" hidden aria-label="Your cup"></ul>
          <p class="photos__hint meta" id="photoHint" hidden></p>
        </div>

        <div class="compose" id="compose" hidden>
          <div
            class="tags"
            id="tags"
            role="radiogroup"
            aria-label="What should the cup read for?"
          >
            <button class="chip" type="button" role="radio" data-topic="love" aria-checked="false">
              Love
            </button>
            <button class="chip" type="button" role="radio" data-topic="career" aria-checked="false">
              Career
            </button>
            <button class="chip" type="button" role="radio" data-topic="general" aria-checked="true">
              General
            </button>
            <button
              class="chip"
              type="button"
              role="radio"
              data-topic="friendships"
              aria-checked="false"
            >
              Friendships
            </button>
            <button class="chip" type="button" role="radio" data-topic="health" aria-checked="false">
              Health
            </button>
            <button class="chip" type="button" role="radio" data-topic="money" aria-checked="false">
              Money
            </button>
          </div>

          <div class="prompt">
            <label class="u-sr" for="promptInput">
              Anything you want the cup to look at, in your own words
            </label>
            <input
              class="prompt__field"
              id="promptInput"
              type="text"
              maxlength="400"
              autocomplete="off"
              placeholder="What to look for?"
            />
            <button class="btn btn--primary prompt__send" id="btnSend" type="button">
              Send reading
            </button>
          </div>
        </div>

        <input
          class="file-input"
          id="filePicker"
          type="file"
          accept="image/*"
          multiple
          tabindex="-1"
          aria-label="Choose up to four photos of your cup"
        />
      </section>

      <!-- ==================================================== READING MOMENT -->
      <section class="screen screen--fixed" id="s-reading" hidden aria-labelledby="reading-title">
        <header class="bar">
          <span class="meta">Reading the cup</span>
        </header>

        <h2 class="u-sr" id="reading-title">Reading your cup</h2>

        <div class="wait">
          <div class="cup cup--lg" aria-hidden="true">
            <svg class="cup__blot" viewBox="0 0 200 200" fill="currentColor">
              <!-- Sediment clinging to the wall, heavy at the bottom left and
                   thinning toward the rim, with one clean channel cut through
                   it. The negative space is a shape too, and often the one
                   that matters. -->
              <path
                opacity=".6"
                fill-rule="evenodd"
                d="M100 5c34 0 63 19 79 49s16 65-2 94-49 47-81 46-62-19-78-49S2 80 20 51 66 5 100 5Z
                   M116 40c26 2 45 22 47 46s-14 46-38 51-49-9-56-31 3-47 22-58 15-9 25-8Z
                   M38 150c14-9 24-23 29-39 4-13 3-27-2-40l-13 6c4 11 5 22 2 32-4 13-12 24-24 31Z"
              />
              <circle opacity=".4" cx="150" cy="168" r="4.5" />
              <circle opacity=".32" cx="112" cy="14" r="3" />
              <circle opacity=".26" cx="176" cy="118" r="2.5" />
            </svg>
          </div>

          <p class="wait__line" id="readingLine" role="status" aria-live="polite"></p>

          <div class="wait__track" aria-hidden="true">
            <div class="wait__fill" id="waitFill"></div>
          </div>
        </div>
      </section>

      <!-- =============================================================== REVEAL -->
      <section class="screen" id="s-reveal" hidden aria-labelledby="omen">
        <header class="bar">
          <span class="meta" id="revealMeta"></span>
        </header>

        <article class="reveal">
          <h2 class="reveal__omen stage" id="omen" style="--i: 0"></h2>

          <hr class="divider stage" style="--i: 1" />

          <div class="stanzas" id="stanzas">
            <svg class="stanzas__blot" viewBox="0 0 200 200" fill="currentColor" aria-hidden="true">
              <path
                d="M120 10c24 8 26 34 40 52s36 24 34 46-24 28-34 46-14 40-36 42-32-20-52-28-42-4-48-26 14-34 16-56S96 2 120 10Z"
              />
            </svg>
          </div>

          <div class="closing stage" id="closingBlock">
            <p class="closing__line" id="closing"></p>
          </div>

          <p class="meta stage" id="demoNote" hidden>From an older cup, not tonight&rsquo;s</p>

          <div class="reveal__actions stage" id="revealActions">
            <button class="btn btn--primary" id="btnShare" type="button">Share this reading</button>
            <button class="btn btn--secondary" type="button" data-go="main">Read another cup</button>
          </div>
        </article>
      </section>

      <!-- ========================================================== UNREADABLE -->
      <section class="screen screen--fixed" id="s-empty" hidden aria-labelledby="emptyOmen">
        <header class="bar">
          <button class="back" type="button" data-go="main">Back</button>
          <span class="meta" id="emptyLabel">No reading</span>
        </header>

        <div class="screen__body">
          <div class="empty">
            <h2 class="display" id="emptyOmen"></h2>
            <p class="empty__note" id="emptyNote"></p>
            <p class="empty__hint" id="emptyHint"></p>
          </div>
        </div>

        <div class="screen__foot">
          <button class="btn btn--primary" id="emptyRetry" type="button" data-go="main">Try another photo</button>
        </div>
      </section>
    </main>

    <!-- ============================================================ SHARE SHEET -->
    <div
      class="sheet"
      id="shareSheet"
      hidden
      role="dialog"
      aria-modal="true"
      aria-labelledby="sheetTitle"
    >
      <div class="sheet__scrim" data-close-sheet></div>

      <div class="sheet__panel">
        <div class="sheet__head">
          <span class="meta" id="sheetTitle">Your card</span>
          <button class="back" type="button" data-close-sheet>Close</button>
        </div>

        <div class="sheet__card">
          <img id="shareCard" alt="A card showing your reading" />
        </div>

        <div class="sheet__actions">
          <button class="btn btn--primary" id="btnShareImage" type="button">Share</button>
          <button class="btn btn--secondary" id="btnSaveImage" type="button">Save image</button>
          <button class="link" id="btnCopyText" type="button">Copy the words</button>
        </div>

        <p class="sheet__status" id="sheetStatus" role="status" aria-live="polite"></p>
      </div>
    </div>

    <!-- ========================================================= SETTINGS SHEET -->
    <div
      class="sheet"
      id="settingsSheet"
      hidden
      role="dialog"
      aria-modal="true"
      aria-labelledby="settingsTitle"
    >
      <div class="sheet__scrim" data-close-sheet></div>

      <div class="sheet__panel">
        <div class="sheet__head">
          <span class="meta" id="settingsTitle">Settings</span>
          <button class="back" type="button" data-close-sheet>Close</button>
        </div>

        <div class="setting">
          <div class="setting__text">
            <p class="setting__label">Ambient sound</p>
            <p class="setting__note">A low room tone under the reading. Off by default.</p>
          </div>
          <button class="chip" id="soundToggle" type="button" aria-pressed="false">
            <span id="soundLabel">Off</span>
          </button>
        </div>
      </div>
    </div>

    <script type="module" src="/scripts/app.js"></script>
  </body>
</html>
